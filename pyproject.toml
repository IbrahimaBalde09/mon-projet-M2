[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segbench"
version = "0.1.0"
description = "Évaluation comparative de méthodes de segmentation sémantique de nuages de points 3D en intérieur"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
viz = ["open3d>=0.18", "matplotlib>=3.7"]
# PyTorch : installer la version adaptée à la machine (CPU ou CUDA), voir README
train = ["torch>=2.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
